# Downloads (Luiz, 2026-10-30): OpenLaser for macOS (universal .dmg) and Windows (.zip). A `v*` tag publishes them
# as a GitHub Release; a pull request touching packaging builds them as workflow artifacts only.
#
# Laser safety (AGENTS.md §1): this workflow compiles the `hw` feature so the downloads can drive a real laser, but it
# never runs a built binary, never sets OPENLASER_HW_PRESENT and runs no tests (ci.yml does, without `hw`). The shipped
# app stays default-deny: the laser needs OPENLASER_HW_PRESENT=1 and a bench session, which the "Start OpenLaser with
# laser" launcher sets up in a terminal window that a person opens.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build for Apple Silicon and Intel
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p openlaser -p openlaser-hw --features openlaser/hw,openlaser-hw/hw
          done

      - name: Make OpenLaser.app and the .dmg
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="openlaser") | .version')
          APP=dist/OpenLaser.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for b in openlaser openlaser-hw; do
            lipo -create -output "$APP/Contents/MacOS/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s apps/openlaser/assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) apps/openlaser/assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          # Ad-hoc signature: lipo drops the linker's, and Apple Silicon refuses unsigned code. Not notarized.
          codesign --force --deep --sign - "$APP"
          cp "packaging/macos/Start OpenLaser with laser.command" dist/
          chmod +x "dist/Start OpenLaser with laser.command"
          cp packaging/README.txt dist/README.txt
          ln -s /Applications dist/Applications
          hdiutil create -volname "OpenLaser $VERSION" -srcfolder dist -ov -format UDZO "OpenLaser-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OpenLaser-*-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p openlaser -p openlaser-hw --features openlaser/hw,openlaser-hw/hw

      - name: Make the .zip
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'openlaser').version
          $dir = "OpenLaser-$version-windows"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/openlaser.exe, target/release/openlaser-hw.exe, packaging/README.txt $dir
          Copy-Item "packaging/windows/Start OpenLaser with laser.cmd" $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OpenLaser-*-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenLaser $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md --prerelease
