# Downloads (Luiz, 2026-10-30): OpenLaser for macOS (universal .dmg) and Windows (.zip: 64-bit, and -x86 for 32-bit). A `v*` tag publishes them
# as a GitHub Release; a pull request touching packaging builds them as workflow artifacts only.
#
# Laser safety (AGENTS.md §1): this workflow compiles the `hw` feature so the downloads can drive a real laser, but it
# never runs a built binary, never sets OPENLASER_HW_PRESENT and runs no tests (ci.yml does, without `hw`). The shipped
# app stays default-deny: the laser needs OPENLASER_HW_PRESENT=1 and a bench session, which the "Start OpenLaser with
# laser" launcher sets up in a terminal window that a person opens.

name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build for Apple Silicon and Intel
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p openlaser -p openlaser-hw --features openlaser/hw,openlaser-hw/hw
          done

      - name: Make OpenLaser.app and the .dmg
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="openlaser") | .version')
          APP=dist/OpenLaser.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for b in openlaser openlaser-hw; do
            lipo -create -output "$APP/Contents/MacOS/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s apps/openlaser/assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) apps/openlaser/assets/icon-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          # Ad-hoc signature: lipo drops the linker's, and Apple Silicon refuses unsigned code. Not notarized.
          codesign --force --deep --sign - "$APP"
          cp "packaging/macos/Start OpenLaser with laser.command" dist/
          chmod +x "dist/Start OpenLaser with laser.command"
          cp packaging/README.txt dist/README.txt
          ln -s /Applications dist/Applications
          hdiutil create -volname "OpenLaser $VERSION" -srcfolder dist -ov -format UDZO "OpenLaser-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OpenLaser-*-macos.dmg
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit Windows 10/11: OpenLaser-<ver>-windows.zip.
          - arch: x64
            target: x86_64-pc-windows-msvc
            suffix: ""
            rustflags: -C target-feature=+crt-static
          # 32-bit Windows 10 (Luiz, 2026-11-01): OpenLaser-<ver>-windows-x86.zip. rustc links i686 programs
          # large-address-aware already; 32-bit Windows still gives a process only 2 GB.
          - arch: x86
            target: i686-pc-windows-msvc
            suffix: "-x86"
            rustflags: -C target-feature=+crt-static
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        # Static C runtime: the .exe files run on a PC without the Visual C++ Redistributable.
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p openlaser -p openlaser-hw --features openlaser/hw,openlaser-hw/hw

      - name: Check the .exe files need no Visual C++ runtime and are built for ${{ matrix.arch }}
        shell: pwsh
        run: |
          $machine = @{ x64 = 0x8664; x86 = 0x014c }['${{ matrix.arch }}']
          foreach ($f in "target/$env:TARGET/release/openlaser.exe", "target/$env:TARGET/release/openlaser-hw.exe") {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text.IndexOf('VCRUNTIME140.dll', [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "$f still needs VCRUNTIME140.dll" }
            $pe = [BitConverter]::ToInt32($bytes, 60)
            $got = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($got -ne $machine) { throw ("{0} is built for machine 0x{1:x4}, expected 0x{2:x4}" -f $f, $got, $machine) }
          }

      - name: Make the .zip
        id: zip
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'openlaser').version
          $dir = "OpenLaser-$version-windows${{ matrix.suffix }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/$env:TARGET/release/openlaser.exe", "target/$env:TARGET/release/openlaser-hw.exe", packaging/README.txt $dir
          Copy-Item "packaging/windows/Start OpenLaser with laser.cmd", "packaging/windows/OpenLaser diagnostics.cmd", packaging/windows/OpenLaser-diagnostics.ps1 $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Run the diagnostics script (read-only; it does not start the programs)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "${{ steps.zip.outputs.dir }}\OpenLaser-diagnostics.ps1" -SkipPrograms -Quiet -OutFile diagnostics.txt || exit /b 1
          type diagnostics.txt
          findstr /c:"SUMMARY" diagnostics.txt || exit /b 1
          findstr /c:"carry their own Visual C++ runtime" diagnostics.txt || exit /b 1
          findstr /c:"These OpenLaser programs are built for: ${{ matrix.arch }}" diagnostics.txt || exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: OpenLaser-*-windows${{ matrix.suffix }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenLaser $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md --prerelease
