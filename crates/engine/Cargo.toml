[package]
name = "openlaser-engine"
description = "Session, command registry and command! macro, origin policy, snapshot undo, job pipeline, device hub, pending ARM, requests, inspect JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openlaser-types = { workspace = true }
openlaser-geom = { workspace = true }
openlaser-doc = { workspace = true }
openlaser-text = { workspace = true }
openlaser-machine = { workspace = true }
openlaser-format = { workspace = true }
openlaser-import = { workspace = true }
openlaser-plan = { workspace = true }
openlaser-safety = { workspace = true }
openlaser-lmc = { workspace = true }
openlaser-gcode = { workspace = true }
openlaser-driver = { workspace = true }
openlaser-camera = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[features]
# Test-only (SPEC §2.3 rule 10): reachable only through dev-dependencies; refuses to build without debug assertions.
test-pedal = []

[dev-dependencies]
openlaser-arm = { workspace = true, features = ["test-witness"] }
openlaser-lmc-sim = { workspace = true }
openlaser-testkit = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
