[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# SPEC §2.4. Exact `=` pins for everything that shapes bytes, geometry, UI or protocols; caret for ubiquitous
# infrastructure. Cargo.lock is the real pin. Work packages never add a dependency that is not listed here and
# never run `cargo update` (ask the integrator).
[workspace.dependencies]
# ---- internal ------------------------------------------------------------------------------------------------
openlaser-types = { path = "crates/types" }
openlaser-geom = { path = "crates/geom" }
openlaser-doc = { path = "crates/doc" }
openlaser-text = { path = "crates/text" }
openlaser-machine = { path = "crates/machine" }
openlaser-format = { path = "crates/format" }
openlaser-import = { path = "crates/import" }
openlaser-plan = { path = "crates/plan" }
openlaser-safety = { path = "crates/safety" }
openlaser-arm = { path = "crates/arm" }
openlaser-render = { path = "crates/render" }
openlaser-gcode = { path = "crates/gcode" }
openlaser-lmc = { path = "crates/lmc" }
openlaser-driver = { path = "crates/driver" }
openlaser-lmc-sim = { path = "crates/lmc-sim" }
openlaser-transport = { path = "crates/transport" }
openlaser-engine = { path = "crates/engine" }
openlaser-control = { path = "crates/control" }
openlaser-automation = { path = "crates/automation" }
openlaser-ui-egui = { path = "crates/ui-egui" }
openlaser-human = { path = "crates/human" }
openlaser-testkit = { path = "crates/testkit" }
openlaser-camera = { path = "crates/camera" }

# ---- GUI stack (S6; only ui-egui, human and apps/openlaser, §2.3 rule 2) ----------------------------------------
# SPEC §2.4 features (PhotoCraft's): egui `default_fonts`; eframe `wgpu` + `accesskit`; egui_extras `svg`; egui_kittest
# dev-only with `eframe`. The app's eframe extras (`persistence`, and the Linux `wayland`/`x11` backends winit needs)
# are declared here too, so every user of eframe resolves ONE feature set and `-p openlaser-ui-egui`/`-p
# openlaser-human` builds reuse the workspace's GUI artifacts in the gui lane (docs/SPEC-CHANGES.md).
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "accesskit", "persistence", "wayland", "x11"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
egui_kittest = { version = "=0.36.2", default-features = false, features = ["eframe"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "3d37da389a3618ab9b76109da11416e9ca4ea719" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "3d37da389a3618ab9b76109da11416e9ca4ea719" }
# Feature `egui` only: craft-quit's `menu` feature needs muda 0.21.2.
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "3d37da389a3618ab9b76109da11416e9ca4ea719", features = ["egui"] }
muda = { version = "=0.21.1", default-features = false }
rfd = { version = "=0.17.2" }

# ---- geometry, raster, files (S7: one kurbo, one usvg, one tiny-skia with egui_extras[svg]) ---------------------
kurbo = { version = "=0.11.3" }
# Text shaping (S19): already resolved to these versions through the GUI stack; used by openlaser-text.
skrifa = { version = "=0.44.0" }
harfrust = { version = "=0.12.0" }
usvg = { version = "=0.45.1", default-features = false }
tiny-skia = { version = "=0.11.4" }
rstar = { version = "=0.13.0" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
# zip's `deflate-flate2` selects no flate2 backend on its own; this does (pure Rust, no C toolchain; §2.4, §2.6).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Declared for P1 (DXF export, booleans, .lbrn2); unused in this build.
dxf = { version = "=0.6.2" }
i_overlay = { version = "=9.1.0" }
quick-xml = { version = "=0.42.0" }

# ---- camera (only openlaser-camera; §2.6: pure-Rust native backends, no decoding/mozjpeg/opencv/wgpu) --------------
# `input-native` keeps AVFoundation (macOS), MSMF/`windows` (Windows) and v4l (Linux); `default-features = false`
# drops the `decoding` path so no C toolchain is needed on Windows (S19). `camera-sync-impl` makes
# `nokhwa::Camera` `Send` so the crate can own it on a pump thread (it pulls no extra dependencies).
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native", "camera-sync-impl"] }

# ---- devices (only openlaser-transport, §2.3 rule 1) ------------------------------------------------------------
nusb = { version = "=0.2.8" }
serialport = { version = "=4.10.1", default-features = false }
keepawake = { version = "=0.6.1", default-features = false }

# ---- automation (only openlaser-automation and apps/openlaser-cli, §2.3 rule 3) --------------------------------
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
schemars = { version = "=1.2.2" }
cap-std = { version = "=4.0.3" }

# ---- infrastructure ------------------------------------------------------------------------------------------
serde = { version = "1", features = ["derive", "rc"] }
# float_roundtrip: the goldens are read exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = { version = "2" }
log = { version = "0.4" }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
getrandom = { version = "=0.3.4" }
crossbeam-channel = { version = "=0.5.17" }
base64 = { version = "=0.22.1" }
sha2 = { version = "=0.11.0" }

# ---- apps/openlaser-hw (§2.6: signal-hook on unix, ctrlc on windows) --------------------------------------------
crossterm = { version = "=0.29.0" }
signal-hook = { version = "=0.4.5" }
ctrlc = { version = "=3.5.2", features = ["termination"] }

# ---- dev-dependencies -------------------------------------------------------------------------------------------
proptest = { version = "=1.12.0" }
insta = { version = "=1.49.0", features = ["json"] }
tempfile = { version = "=3.27.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"

# PhotoCraft's profiles, plus an explicit unwind (SPEC §1.3 rule 6, §2.5).
[profile.dev]
opt-level = 1
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# No `[profile.test] panic` key (SPEC §2.5): Cargo ignores `panic` for the test profile (tests always unwind) and
# warns about it.

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
