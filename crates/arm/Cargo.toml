[package]
name = "openlaser-arm"
description = "mint(): the only code that creates an ArmToken; human-confirmation witnesses (red zone)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only (SPEC §2.3 rule 10): reachable only through dev-dependencies; refuses to build without debug assertions.
test-witness = []

[dependencies]
openlaser-types = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
openlaser-arm = { path = ".", features = ["test-witness"] }
openlaser-testkit = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
