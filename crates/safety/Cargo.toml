[package]
name = "openlaser-safety"
description = "validate(): every hard refusal and notice; the sole constructor of EmitPlan and FramePlan (red zone)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only (SPEC §2.3 rule 10): reachable only through dev-dependencies; refuses to build without debug assertions.
unchecked-for-tests = []

[dependencies]
openlaser-types = { workspace = true }
openlaser-geom = { workspace = true }
openlaser-doc = { workspace = true }
openlaser-machine = { workspace = true }
openlaser-plan = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
openlaser-safety = { path = ".", features = ["unchecked-for-tests"] }
openlaser-testkit = { workspace = true }
openlaser-import = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
